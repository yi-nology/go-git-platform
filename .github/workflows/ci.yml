name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Superseded runs on the same branch are cancelled to save runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Root jobs test only the root module: the committed go.work would
    # otherwise widen their scope. The mcp job keeps workspace mode.
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned: @latest makes the check non-reproducible and lets a bad
      # release break CI. Bump deliberately alongside x/vuln's database.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          floor=45
          echo "Total coverage: ${total}% (floor ${floor}%)"
          awk -v c="$total" -v f="$floor" 'BEGIN { exit c+0 < f+0 ? 1 : 0 }' || {
            echo "::error::total coverage ${total}% dropped below the ${floor}% floor"
            exit 1
          }

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  mcp:
    name: MCP module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: mcp/go.sum

      # 模块元数据漂移（根 go.mod 改动后 mcp require/go.sum 未跟随）必须
      # 显式失败，而不是像旧配置那样在 CI 里被自动修复掩盖。GOWORK=off
      # 让 tidy 走 require 版本行的发布解析路径——这正是它要校验的形态。
      - name: Tidy check
        working-directory: mcp
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        working-directory: mcp
        run: go build ./...

      - name: Vet
        working-directory: mcp
        run: go vet ./...

      - name: Test
        working-directory: mcp
        run: go test -race -count=1 ./...

  # 独立分发验证：go install pkg@ref 必须真实可用（评审 P1）。@ref 从
  # proxy 拉取，GOWORK=off 确保 @version 语法不被 workspace 拦截。
  mcp-install:
    name: MCP standalone install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install from module proxy
        env:
          GOWORK: 'off'
        run: go install github.com/yi-nology/go-git-platform/mcp/cmd/go-git-platform-mcp@${{ github.event.pull_request.head.sha || github.sha }}

      - name: Smoke the installed binary
        run: '"$(go env GOPATH)/bin/go-git-platform-mcp" --help'
