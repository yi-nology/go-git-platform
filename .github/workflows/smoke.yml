# Real-environment smoke test (issue #119): manually dispatched only.
#
# The contract suites run against httptest fakes; this workflow is the
# manual trigger that points the env-gated smoke test (smoke/) at a LIVE
# platform so wire drift surfaces as a red run instead of waiting for a
# human probe round. Strictly read-only probe families (smoke/probes.go):
# repo | cr | webhook | pagination | errors | connection — no writes ever.
#
# Secrets (spec §5 list — the repository currently has NONE configured;
# until they are added every run SKIPs (env-gated), never fails):
#   GIT_PLATFORM_SMOKE_TOKEN_GITHUB      patrol token for GitHub
#   GIT_PLATFORM_SMOKE_TOKEN_GITLAB      patrol token for GitLab
#   GIT_PLATFORM_SMOKE_TOKEN_GITEA       patrol token for Gitea
#   GIT_PLATFORM_SMOKE_TOKEN_FORGEJO     patrol token for Forgejo
#   GIT_PLATFORM_SMOKE_TOKEN_GITEE       patrol token for Gitee
#   GIT_PLATFORM_SMOKE_TOKEN_GITCODE     patrol token for GitCode
#   GIT_PLATFORM_SMOKE_TOKEN_TENCENTCODE patrol token for TencentCode
#   SMOKE_TOKEN                          fallback for any platform
# Add one with: gh secret set GIT_PLATFORM_SMOKE_TOKEN_GITHUB   (etc.)
# Dispatch: platform=all + families=all runs the full 7×6 patrol matrix.

name: smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (github|gitlab|gitea|forgejo|gitee|gitcode|tencentcode, or all for the full matrix)'
        required: false
        default: 'github'
      families:
        description: 'Probe families: comma-separated subset of repo|cr|webhook|pagination|errors|connection, or all'
        required: false
        default: 'repo'
      owner:
        description: 'Owner (org or user) to probe'
        required: true
      repo:
        description: 'Repository to probe'
        required: true
      url:
        description: 'Optional base URL (self-hosted platforms)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.inputs.platform }}-${{ github.event.inputs.owner }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Patrol semantics: one platform going red must not cancel the rest
      # of the matrix — every unit reports its own verdict.
      fail-fast: false
      matrix:
        # Single-platform narrowing, shorter than a two-job split: when
        # platform names one platform the matrix collapses to that one
        # unit (default 'github' = the historical single run, zero behavior
        # change for existing dispatchers); '' or 'all' fans out to the
        # seven-platform matrix.
        platform: ${{ (github.event.inputs.platform == '' || github.event.inputs.platform == 'all') && fromJSON('["github","gitlab","gitea","forgejo","gitee","gitcode","tencentcode"]') || fromJSON(format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      # Token selection: GIT_PLATFORM_SMOKE_TOKEN_<PLATFORM> secret when it
      # exists, falling back to SMOKE_TOKEN. A missing secret makes the test
      # SKIP (env-gated), not fail — dispatch without secrets is a no-op.
      - name: Run smoke test
        env:
          GIT_PLATFORM_SMOKE_PLATFORM: ${{ matrix.platform }}
          GIT_PLATFORM_SMOKE_FAMILIES: ${{ github.event.inputs.families }}
          GIT_PLATFORM_SMOKE_OWNER: ${{ github.event.inputs.owner }}
          GIT_PLATFORM_SMOKE_REPO: ${{ github.event.inputs.repo }}
          GIT_PLATFORM_SMOKE_URL: ${{ github.event.inputs.url }}
          GIT_PLATFORM_SMOKE_TOKEN_GITHUB: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_GITHUB }}
          GIT_PLATFORM_SMOKE_TOKEN_GITLAB: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_GITLAB }}
          GIT_PLATFORM_SMOKE_TOKEN_GITEA: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_GITEA }}
          GIT_PLATFORM_SMOKE_TOKEN_FORGEJO: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_FORGEJO }}
          GIT_PLATFORM_SMOKE_TOKEN_GITEE: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_GITEE }}
          GIT_PLATFORM_SMOKE_TOKEN_GITCODE: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_GITCODE }}
          GIT_PLATFORM_SMOKE_TOKEN_TENCENTCODE: ${{ secrets.GIT_PLATFORM_SMOKE_TOKEN_TENCENTCODE }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          platform="$(echo "${GIT_PLATFORM_SMOKE_PLATFORM}" | tr '[:lower:]' '[:upper:]')"
          token_var="GIT_PLATFORM_SMOKE_TOKEN_${platform}"
          token="${!token_var:-${SMOKE_TOKEN}}"
          if [ -z "${token}" ]; then
            echo "::warning::no ${token_var} / SMOKE_TOKEN secret configured — the smoke test will skip"
          fi
          export GIT_PLATFORM_SMOKE_TOKEN="${token}"
          go test ./smoke/ -v -run TestSmoke -count=1
